# Lifecycle harness self-tests — PR guard.
#
# The full container-based lifecycle run is a LOCAL, dev-owned, pre-release
# check (see tests/lifecycle/README.md), not a CI step: the bind-mounted home
# dir is created by the container's `agent` user and isn't accessible to the CI
# runner (uid mismatch across the bind mount), and we deliberately don't run
# the Z-stage lifecycle in CI. What CI keeps is the harness's OWN unit tests —
# container-free, no alf binary needed: redaction + the scenario drift guard,
# the WP-M4 MCP coverage (test_mcp_client, test_invoker — the stdlib MCP client
# and the CLI/MCP invoker seam; test_mcp_generic skips without a built alf), the
# archive identity oracles, the bake/viz-server secret policy, and the
# gate-honesty pins.
#
# The repo-wide secret-pattern gate used to be a second step here. It moved to
# secret-scan.yml, which is deliberately UNFILTERED: a whole-tree scan must not
# be conditional on which crate a PR happened to touch (a docs- or
# fixture-only PR — exactly the kind that carries pasted output — never ran it).
#
# Run the container lifecycle locally — one tier, or the whole offline set:
#   python3 tests/lifecycle/driver.py --framework <fw> --llm none --backend none
#   python3 tests/lifecycle/run_all.py          (or ./test.sh lifecycle-all)
name: lifecycle-selftests

on:
  pull_request:
    paths:
      - "alf-cli/**"
      - "alf-core/**"
      - "adapter-openclaw/**"
      - "adapter-zeroclaw/**"
      - "adapter-hermes/**"
      # adapter-generic's map schema is coupled to the generic/generic-mcp kit
      # fixtures (tests/lifecycle/frameworks/generic*/fixture/.alf-map.json), so
      # a change here can invalidate the harness. Missing until 2026-07-28.
      - "adapter-generic/**"
      - "tests/lifecycle/**"
      - ".github/workflows/lifecycle-nollm.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftests:
    name: harness self-tests (container-free)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Harness self-tests
        run: python3 -m unittest discover -s tests/lifecycle -p 'test_*.py' -v
