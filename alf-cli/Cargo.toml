[package]
name = "alf-cli"
version = "1.1.0"
edition = "2021"
description = "CLI for the Agent Life Format — export, import, validate, and sync agent data"
license = "MIT"
repository = "https://github.com/agent-life/agent-life-adapters"

[[bin]]
name = "alf"
path = "src/main.rs"

[features]
# Enables the WP-M3 upload fault-injection seam (a process-abort before the
# sync upload) for the live-tier kill/restart gate (WP-M4). NEVER enabled in the
# default/release build — the seam compiles to a no-op without it.
fault-injection = []

[dependencies]
alf-core = { path = "../alf-core" }
adapter-openclaw = { path = "../adapter-openclaw" }
adapter-zeroclaw = { path = "../adapter-zeroclaw" }
adapter-hermes = { path = "../adapter-hermes" }
adapter-generic = { path = "../adapter-generic" }
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
colored = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"
uuid = { version = "1", features = ["v7"] }
# MCP server (`alf mcp serve`). rmcp's `server` feature pulls schemars 1.x; we
# depend on the SAME schemars so `#[derive(JsonSchema)]` on our output structs
# interops with rmcp's outputSchema generation. tokio is already transitive via
# blocking reqwest — the new weight is rmcp/schemars only (see WP-M2a handoff).
# P4 re-check (WP-M6, 2026-07-08): 2.1.0 is the latest published rmcp and it
# already lists 2026-07-28 in KNOWN_VERSIONS, so it echo-negotiates every
# revision through the RC (design §4/F16). Locked to 2.1.0 in Cargo.lock.
# Final re-verified 2026-07-29: no relevant change for this stdio server (all
# breaks are Streamable-HTTP-scoped or optional extensions; the deprecated
# capabilities were never used here) — rmcp 3.x adoption is a v1.2 work item.
rmcp = { version = "2.1", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = { version = "1", features = ["chrono04", "uuid1"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "sync", "io-std", "macros", "time"] }
# WP-M3 watch loop: `notify` is the cross-platform FS watcher (inotify/FSEvents/
# kqueue/Windows — audited for the 5 release triples in the handoff). `fs2` gives
# the per-agent advisory lock (flock) — the first lock in alf-cli. `rusqlite`
# (bundled, same version the zeroclaw/hermes adapters already link) backs the
# SQLite-safe capture (`VACUUM INTO`); it adds no new native build.
notify = "6"
fs2 = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"
assert_cmd = "2"
predicates = "3"
serde_json = "1"
shlex = "1"
# MCP stdout-discipline harness: validate tool `structuredContent` against each
# tool's declared `outputSchema`. Both schema and instance are already in
# memory, so the default features are all cost and no benefit: `resolve-http`
# pulls a SECOND reqwest major plus rustls/aws-lc-sys (a cmake C build) into
# every `cargo test --workspace`, for remote `$ref` fetching this never does.
jsonschema = { version = "0.46", default-features = false }


