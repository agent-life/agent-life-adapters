# Lifecycle harness — the PR CI tier: no LLM and no backend (user-ratified
# D2). ZERO GitHub secrets, by design: the driver hard-refuses --llm proxy /
# --backend real when CI=true, and this workflow has no `secrets:` anywhere.
# Z4 needs a backend, so CI runs Z1-Z3 + Z13' (the determinism double-export).
name: lifecycle-nollm

on:
  pull_request:
    paths:
      - "alf-cli/**"
      - "alf-core/**"
      - "adapter-openclaw/**"
      - "adapter-zeroclaw/**"
      - "adapter-hermes/**"
      - "tests/lifecycle/**"
      - ".github/workflows/lifecycle-nollm.yml"
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # nightly: catches upstream installer drift
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    name: lifecycle (${{ matrix.framework }}, no-LLM/no-backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [zeroclaw]
    steps:
      - uses: actions/checkout@v4

      # Secret-pattern gate: no real key shape may exist anywhere in the tree.
      # (Committed fake markers are …-FAKE-… and do not match; regex *pattern*
      # strings don't match themselves — '[' is not alphanumeric.)
      - name: Secret-pattern gate
        run: '! git grep -IE "alf_[A-Za-z0-9]{32}"'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2

      # The container base (debian bookworm) has an older glibc than the
      # runner, so the alf-under-test is a musl build — same recipe as the
      # release pipeline (cargo-zigbuild; reqwest uses rustls, so it's clean).
      - name: Build alf-under-test (musl)
        run: |
          pip install cargo-zigbuild ziglang
          cargo zigbuild --release --target x86_64-unknown-linux-musl -p alf-cli

      - name: Harness self-tests (redaction + scenario drift guard)
        run: python3 -m unittest discover -s tests/lifecycle -p 'test_*.py' -v

      - uses: docker/setup-buildx-action@v3
      - name: Build framework image (gha layer cache)
        uses: docker/build-push-action@v6
        with:
          context: tests/lifecycle/frameworks/${{ matrix.framework }}
          tags: alf-lifecycle-${{ matrix.framework }}
          load: true
          cache-from: type=gha,scope=lifecycle-${{ matrix.framework }}
          cache-to: type=gha,scope=lifecycle-${{ matrix.framework }},mode=max

      - name: Run lifecycle driver (seeded, no backend)
        env:
          ALFLAB_SKIP_IMAGE_BUILD: "1"
        run: |
          python3 tests/lifecycle/driver.py --framework ${{ matrix.framework }} \
            --llm none --backend none --ci --stages Z1-Z3,Z13

      - name: Upload redacted report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-report-${{ matrix.framework }}
          path: |
            tests/lifecycle/runs/*/report.md
            tests/lifecycle/runs/*/report.json
            tests/lifecycle/runs/*/driver.log
          if-no-files-found: ignore
