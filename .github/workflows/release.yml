# Build the alf CLI for all platforms and publish a GitHub Release.
# Triggered by pushing a version tag: git tag v0.1.0 && git push origin v0.1.0

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write          # needed to create releases and upload assets

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-version:
    name: Verify tag matches alf-cli/Cargo.toml
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check git tag matches package version
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME:?}"

          if [[ "$TAG_NAME" != v* ]]; then
            echo "::error::Release tags must start with 'v' (got: ${TAG_NAME})"
            exit 1
          fi

          TAG_VERSION="${TAG_NAME#v}"
          CARGO_VERSION=$(grep -E '^version[[:space:]]*=' alf-cli/Cargo.toml | head -1 | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')

          if [[ -z "$CARGO_VERSION" ]]; then
            echo "::error::Could not read version from alf-cli/Cargo.toml"
            exit 1
          fi

          if [[ "$TAG_VERSION" != "$CARGO_VERSION" ]]; then
            echo "::error::Version mismatch: tag is '${TAG_NAME}' (expected semver '${TAG_VERSION}') but alf-cli/Cargo.toml has version = \"${CARGO_VERSION}\"."
            echo ""
            echo "alf --version is compiled from CARGO_PKG_VERSION in alf-cli; it must match the release tag."
            echo ""
            echo "How to fix:"
            echo "  A) Match the tag: set version = \"${TAG_VERSION}\" in alf-cli/Cargo.toml, commit, then point the tag at that commit and force-push the tag:"
            echo "       # after committing the version bump:"
            echo "       git tag -f ${TAG_NAME} && git push -f origin ${TAG_NAME}"
            echo ""
            echo "  B) Match Cargo.toml: delete the mismatched tag and push a new tag whose name is v${CARGO_VERSION}:"
            echo "       git push origin :refs/tags/${TAG_NAME}"
            echo "       git tag v${CARGO_VERSION} <commit-with-current-toml>"
            echo "       git push origin v${CARGO_VERSION}"
            exit 1
          fi

          echo "OK: tag ${TAG_NAME} matches alf-cli/Cargo.toml version ${CARGO_VERSION}"

  test:
    name: Test
    needs: verify-version
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace

  fault-injection:
    name: Fault-injection tests
    needs: verify-version
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run fault-injection tests
        run: cargo test --workspace --features fault-injection

  build:
    name: ${{ matrix.bin_name }}
    needs: [test, fault-injection]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin_name: alf-linux-amd64
            use_cross: false
          # Linux ARM64 (cross-compiled via cross)
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            bin_name: alf-linux-arm64
            use_cross: true
          # macOS Intel
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bin_name: alf-darwin-amd64
            use_cross: false
          # macOS Apple Silicon
          - os: macos-14
            target: aarch64-apple-darwin
            bin_name: alf-darwin-arm64
            use_cross: false
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: alf-windows-amd64.exe
            use_cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (cargo)
        if: matrix.use_cross == false
        run: cargo build --release -p alf-cli --target ${{ matrix.target }}

      - name: Install cross and build (Linux ARM64)
        if: matrix.use_cross == true
        run: |
          cargo install cross
          cross build --release -p alf-cli --target ${{ matrix.target }}

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/alf ${{ matrix.bin_name }}

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: copy "target\${{ matrix.target }}\release\alf.exe" ${{ matrix.bin_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bin_name }}
          path: ${{ matrix.bin_name }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect binaries and install script
        run: |
          mkdir release-assets
          for dir in artifacts/*/; do
            cp "$dir"* release-assets/
          done
          cp scripts/install.sh release-assets/
          ls -lh release-assets/

      - name: Generate SHA256 checksums
        run: |
          cd release-assets
          for f in alf-linux-amd64 alf-linux-arm64 alf-darwin-amd64 alf-darwin-arm64 alf-windows-amd64.exe; do
            [ -f "$f" ] && sha256sum "$f" > "${f}.sha256" && echo "Generated ${f}.sha256"
          done
          ls -lh *.sha256 2>/dev/null || true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

  upload-s3:
    name: Upload to S3 (agent-life.ai)
    needs: release
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ github.ref_name }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          for dir in artifacts/*/; do
            cp "$dir"* release-assets/
          done
          cp scripts/install.sh release-assets/
          # Generate SHA256 checksums for binaries
          cd release-assets
          for f in alf-linux-amd64 alf-linux-arm64 alf-darwin-amd64 alf-darwin-arm64 alf-windows-amd64.exe; do
            [ -f "$f" ] && sha256sum "$f" > "${f}.sha256"
          done
          cd ..
          ls -la release-assets/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Validate and set S3 bucket name
        run: |
          # Use bucket name only (not ARN). Normalize common paste issues (BOM, NBSP, s3:// URL).
          BUCKET="${AWS_S3_BUCKET}"
          # Strip UTF-8 BOM if the secret was re-saved from an editor that adds it
          BUCKET="${BUCKET#$'\xef\xbb\xbf'}"
          BUCKET=$(printf '%s' "$BUCKET" | tr -d '\n\r')
          # NBSP (U+00A0) and other odd spaces → regular space, then trim
          BUCKET="${BUCKET//$'\xc2\xa0'/ }"
          BUCKET=$(printf '%s' "$BUCKET" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          # Accept s3://bucket or s3://bucket/prefix — AWS CLI needs the label only
          case "$BUCKET" in
            [sS]3://*)
              BUCKET="${BUCKET#[sS]3://}"
              BUCKET="${BUCKET%%/*}"
              ;;
          esac
          if [ -z "$BUCKET" ]; then
            echo "::error::AWS_S3_BUCKET secret is empty. Set it to the bucket name only (e.g. agent-life-ai), not an ARN."
            exit 1
          fi
          if [ "$BUCKET" != "${BUCKET#arn:}" ]; then
            echo "::error::AWS_S3_BUCKET must be the bucket name only (e.g. agent-life-ai), not an ARN. Got value starting with 'arn:'"
            exit 1
          fi
          # Bucket name must match AWS DNS-style labels; put '-' last in [] so it is literal (not a range)
          if ! printf '%s' "$BUCKET" | grep -qE '^[a-zA-Z0-9._-]{1,255}$'; then
            echo "::error::AWS_S3_BUCKET contains invalid characters after normalization. Use the bucket DNS name only (letters, digits, . - _). Re-save the secret without URLs, paths, or hidden Unicode. Length was ${#BUCKET}."
            exit 1
          fi
          echo "BUCKET=$BUCKET" >> "$GITHUB_ENV"

      - name: Upload to S3
        run: |
          for f in release-assets/*; do
            name=$(basename "$f")
            case "$name" in
              *.sh)     ct="text/plain" ;;
              *.sha256) ct="text/plain" ;;
              *)        ct="application/octet-stream" ;;
            esac
            aws s3 cp "$f" "s3://${BUCKET}/releases/${VERSION}/$name" \
              --acl public-read \
              --content-type "$ct"
            aws s3 cp "$f" "s3://${BUCKET}/$name" \
              --acl public-read \
              --content-type "$ct"
            aws s3 cp "$f" "s3://${BUCKET}/releases/latest/$name" \
              --acl public-read \
              --content-type "$ct"
          done
          echo "Uploaded to s3://${BUCKET}/releases/${VERSION}/"
          echo "Uploaded to s3://${BUCKET}/releases/latest/"
          echo "Uploaded to s3://${BUCKET}/"

      - name: Build CLI docs
        # Only runs if docs/cli-reference.md exists (created in a later phase).
        # Non-fatal if pandoc fails so the release still completes.
        run: |
          if [ ! -f docs/cli-reference.md ]; then
            echo "docs/cli-reference.md not found — skipping CLI docs build"
            exit 0
          fi
          sudo apt-get install -y pandoc
          pandoc docs/cli-reference.md \
            -o docs/cli-reference.html \
            --standalone \
            --metadata title="alf CLI Reference" \
            --css=style.css || echo "pandoc build failed — continuing"

      - name: Upload docs to S3
        # Only runs if the HTML was successfully built.
        run: |
          if [ ! -f docs/cli-reference.html ]; then
            echo "docs/cli-reference.html not found — skipping docs upload"
            exit 0
          fi
          aws s3 cp docs/cli-reference.html "s3://${BUCKET}/docs/cli/index.html" \
            --content-type "text/html" --acl public-read
          aws s3 cp docs/cli-reference.md "s3://${BUCKET}/docs/cli.md" \
            --content-type "text/markdown; charset=utf-8" --acl public-read
          if [ -f docs/style.css ]; then
            aws s3 cp docs/style.css "s3://${BUCKET}/docs/style.css" \
              --content-type "text/css" --acl public-read
          fi
          echo "Docs uploaded to s3://${BUCKET}/docs/"
