# Repo-wide secret gate — runs on EVERY pull request, deliberately unfiltered.
#
# This used to be a step inside lifecycle-nollm.yml, whose `paths:` filter lists
# Rust crate directories. That made a whole-tree safety net conditional on which
# crate a PR happened to touch: a PR that only added a captured fixture, a debug
# transcript, or a documentation example — exactly the changes that carry pasted
# output — never ran the scan at all, and CI reported success for a tree it had
# not looked at.
#
# So this workflow has no `paths:` filter and never will. It is a few seconds of
# `git grep`; the cost of running it always is nothing next to the cost of a key
# reaching git history, where revocation is the only remedy.
#
# What it matches: the service runtime/API key shape `alf_<32 alphanumerics>`.
# Committed fake markers are `…-FAKE-…` and do not match. The pattern string
# cannot match itself (`[` is not alphanumeric). Test fixtures that need a
# realistic shape build it at runtime (e.g. `"alf_" + "S3cr3tK" * 4`) rather
# than embedding a literal.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-pattern-gate:
    name: secret-pattern gate (whole tree)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: No runtime-key shape anywhere in the tree
        run: '! git grep -IE "alf_[A-Za-z0-9]{32}"'
