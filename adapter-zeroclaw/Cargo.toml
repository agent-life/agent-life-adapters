[package]
name = "adapter-zeroclaw"
version = "0.1.4"
edition = "2021"
description = "ZeroClaw framework adapter for the Agent Life Format (ALF)"
license = "MIT"
repository = "https://github.com/agent-life/agent-life-adapters"

[dependencies]
alf-core = { path = "../alf-core" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
ignore = "0.4"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v5", "v7", "serde"] }
walkdir = "2"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
zip = "2.2"